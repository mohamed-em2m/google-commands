[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "google-commands"
version = "1.0.0"
description = "Real-time audio command recognition using an ensemble of deep learning models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["speech-recognition", "deep-learning", "audio", "tensorflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tensorflow>=2.9",
    "numpy>=1.21",
    "librosa>=0.9",
    "sounddevice>=0.4",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "joblib>=1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/mohamed-em2m/google-commands"
Repository = "https://github.com/mohamed-em2m/google-commands.git"

[project.scripts]
google-commands = "google_commands.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"google_commands" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
